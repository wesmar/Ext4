<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 270" style="width:100%;height:auto;display:block;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;" role="img" aria-label="Ext4 for Windows — native ext2, ext3 and ext4 file system driver">
  <defs>
    <linearGradient id="ext4Bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="52%" stop-color="#07111f"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>
    <radialGradient id="ext4Halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="24%" stop-color="#bbf7d0" stop-opacity=".96"/>
      <stop offset="56%" stop-color="#22c55e" stop-opacity=".76"/>
      <stop offset="84%" stop-color="#2563eb" stop-opacity=".3"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ext4Core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="27%" stop-color="#dcfce7"/>
      <stop offset="58%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#14532d"/>
    </radialGradient>
    <linearGradient id="ext4Title" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="37%" stop-color="#16a34a"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="63%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="ext4Beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0"/>
      <stop offset="20%" stop-color="#2563eb" stop-opacity="1"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="80%" stop-color="#22c55e" stop-opacity="1"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ext4Shine" x1="0" y1="0" x2=".28" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".92"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
      <animate attributeName="x1" values="-.35;1.1" dur="4.2s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="-.07;1.38" dur="4.2s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="ext4Clip"><rect width="860" height="270" rx="14"/></clipPath>
  </defs>
  <style>
    @keyframes ext4-spin { from { transform:rotate(0deg); } to { transform:rotate(360deg); } }
    @keyframes ext4-spin-r { from { transform:rotate(0deg); } to { transform:rotate(-360deg); } }
    @keyframes ext4-pulse { 0%,100% { transform:scale(1); filter:drop-shadow(0 0 9px rgba(34,197,94,.8)); } 50% { transform:scale(1.08); filter:drop-shadow(0 0 22px rgba(37,99,235,.85)); } }
    @keyframes ext4-flow { from { stroke-dashoffset:150; opacity:0; } 20%,80% { opacity:1; } to { stroke-dashoffset:0; opacity:0; } }
    @keyframes ext4-flow-r { from { stroke-dashoffset:-150; opacity:0; } 20%,80% { opacity:1; } to { stroke-dashoffset:0; opacity:0; } }
    @keyframes ext4-down { 0%,100% { transform:translateY(0); opacity:.6; } 50% { transform:translateY(4px); opacity:1; } }
    .x4-ring-a { transform-origin:430px 86px; animation:ext4-spin 8s linear infinite; }
    .x4-ring-b { transform-origin:430px 86px; animation:ext4-spin-r 5.5s linear infinite; }
    .x4-core { transform-origin:430px 86px; animation:ext4-pulse 2.8s ease-in-out infinite; }
    .x4-flow { animation:ext4-flow 2.3s ease-in-out infinite; }
    .x4-flow-r { animation:ext4-flow-r 2.3s ease-in-out infinite; }
    .x4-down { animation:ext4-down 2s ease-in-out infinite; }
  </style>
  <g clip-path="url(#ext4Clip)">
  <rect width="860" height="270" fill="url(#ext4Bg)"/>
  <ellipse cx="430" cy="88" rx="330" ry="150" fill="url(#ext4Halo)" opacity=".3"/>
  <rect x="-24" y="0" width="3" height="270" fill="#ffffff" opacity=".3"><animate attributeName="x" values="-24;884" dur="6.4s" repeatCount="indefinite"/></rect>
  <rect x="2" y="2" width="856" height="266" rx="14" fill="none" stroke="#22c55e" stroke-width="1.4" stroke-dasharray="8 6" opacity=".55"/>
  <path d="M16 26V16H26 M844 26V16H834 M16 244V254H26 M844 244V254H834" fill="none" stroke="#2563eb" stroke-width="2" opacity=".8"/>
  <text x="430" y="20" text-anchor="middle" font-family="ui-monospace,'Cascadia Code',Consolas,monospace" font-size="11" letter-spacing="3.1" fill="#86efac" font-weight="700">WINDOWS KERNEL MODE · EXT2 / EXT3 / EXT4 · JOURNALED READ + WRITE</text>

  <g transform="translate(46 72)" font-family="ui-monospace,'Cascadia Code',Consolas,monospace" font-size="9.5">
    <rect x="0" y="-16" width="154" height="21" rx="4" fill="#0f172a" fill-opacity=".92" stroke="#2563eb" stroke-width="1.2"/>
    <text x="77" y="-2" text-anchor="middle" fill="#dbeafe" font-weight="700">I/O · CACHE</text>
    <rect x="0" y="10" width="154" height="21" rx="4" fill="#0f172a" fill-opacity=".92" stroke="#22c55e" stroke-width="1.2"/>
    <text x="77" y="24" text-anchor="middle" fill="#dcfce7" font-weight="700">IRP · FCB · MCB · VCB</text>
    <rect x="0" y="36" width="154" height="21" rx="4" fill="#0f172a" fill-opacity=".92" stroke="#2563eb" stroke-width="1.2"/>
    <text x="77" y="50" text-anchor="middle" fill="#dbeafe" font-weight="700">DRIVE LETTER · MOUNT</text>
    <path d="M154 -5L309 14 M154 20L309 14 M154 46L309 14" fill="none" stroke="#2563eb" stroke-width="1.3" stroke-dasharray="6 6" opacity=".62"/>
    <path d="M154 20L309 14" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-dasharray="24 150" class="x4-flow"/>
  </g>

  <g transform="translate(660 72)" font-family="ui-monospace,'Cascadia Code',Consolas,monospace" font-size="9.5">
    <rect x="0" y="-16" width="154" height="21" rx="4" fill="#0f172a" fill-opacity=".92" stroke="#22c55e" stroke-width="1.2"/>
    <text x="77" y="-2" text-anchor="middle" fill="#dcfce7" font-weight="700">JBD2 TRANSACTION</text>
    <rect x="0" y="10" width="154" height="21" rx="4" fill="#0f172a" fill-opacity=".92" stroke="#2563eb" stroke-width="1.2"/>
    <text x="77" y="24" text-anchor="middle" fill="#dbeafe" font-weight="700">EXTENTS · HTREE · CRC32C</text>
    <rect x="0" y="36" width="154" height="21" rx="4" fill="#0f172a" fill-opacity=".92" stroke="#22c55e" stroke-width="1.2"/>
    <text x="77" y="50" text-anchor="middle" fill="#dcfce7" font-weight="700">E2FSCK-CLEAN MEDIA</text>
    <path d="M0 -5L-109 14 M0 20L-109 14 M0 46L-109 14" fill="none" stroke="#22c55e" stroke-width="1.3" stroke-dasharray="6 6" opacity=".62"/>
    <path d="M0 20L-109 14" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-dasharray="24 150" class="x4-flow-r"/>
  </g>

  <circle cx="430" cy="86" r="64" fill="url(#ext4Halo)"/>
  <g class="x4-ring-a">
    <ellipse cx="430" cy="86" rx="78" ry="20" fill="none" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="9 6" opacity=".7"/>
    <circle cx="508" cy="86" r="3" fill="#60a5fa"/>
  </g>
  <g class="x4-ring-b">
    <ellipse cx="430" cy="86" rx="62" ry="16" fill="none" stroke="#22c55e" stroke-width="1.7"/>
    <ellipse cx="430" cy="86" rx="62" ry="16" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-dasharray="28 230" stroke-linecap="round"/>
  </g>
  <g class="x4-core">
    <rect x="407" y="63" width="46" height="46" rx="5" fill="#0f172a" stroke="#22c55e" stroke-width="1.6"/>
    <path d="M414 73H446 M414 81H446 M414 89H446 M414 97H446" stroke="#86efac" stroke-width="1" opacity=".8"/>
    <circle cx="430" cy="86" r="7" fill="url(#ext4Core)" stroke="#fff" stroke-width=".8"/>
  </g>

  <text x="430" y="176" text-anchor="middle" font-size="42" font-weight="900" letter-spacing="5" fill="url(#ext4Title)" stroke="#14532d" stroke-width=".8">EXT4 FOR WINDOWS</text>
  <text x="430" y="176" text-anchor="middle" font-size="42" font-weight="900" letter-spacing="5" fill="url(#ext4Shine)">EXT4 FOR WINDOWS</text>
  <line x1="151" y1="197" x2="709" y2="197" stroke="url(#ext4Beam)" stroke-width="2"/>
  <polygon points="430,192 435,197 430,202 425,197" fill="#22c55e" stroke="#fff" stroke-width=".8"/>
  <text x="430" y="219" text-anchor="middle" font-family="ui-monospace,'Cascadia Code',Consolas,monospace" font-size="11.5" letter-spacing="2.6" fill="#cbd5e1" font-weight="700">NATIVE WINDOWS FILE SYSTEM · LINUX-CHECKED ON-DISK STATE</text>
  <g transform="translate(430 241)" class="x4-down">
    <polyline points="-12,0 0,8 12,0" fill="none" stroke="#2563eb" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="-7,7 0,13 7,7" fill="none" stroke="#22c55e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  </g>
</svg>
